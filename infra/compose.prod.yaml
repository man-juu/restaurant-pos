# Production and staging stack (docs/07 section 2). One file, two projects:
#   docker compose -p pos-prod    --env-file /etc/restaurant-pos/prod.env    -f compose.prod.yaml up -d
#   docker compose -p pos-staging --env-file /etc/restaurant-pos/staging.env -f compose.prod.yaml up -d
# Secrets live only in the env file (root-owned, mode 600), never in Git.
# Images are immutable, tagged by release: IMAGE_TAG=v1.2.3.

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DATABASE_URL: postgresql+asyncpg://pos_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-pos}
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}
  APP_BASE_URL: https://${APP_DOMAIN:?set APP_DOMAIN}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-app: &app
  image: ${IMAGE_REGISTRY:-ghcr.io/man-juu/restaurant-pos}/api:${IMAGE_TAG:?set IMAGE_TAG}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [internal]
  depends_on:
    db: { condition: service_healthy }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      POSTGRES_USER: ${POSTGRES_USER:-pos_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:?set READONLY_DB_PASSWORD}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-512MB}", "-c", "max_connections=60"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    networks: [internal]  # never published: no ports
    mem_limit: ${DB_MEM_LIMIT:-1200m}

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-env
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pos_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pos}

  api:
    <<: *app
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      retries: 5
    mem_limit: ${API_MEM_LIMIT:-600m}

  admin:
    <<: *app
    command: ["uvicorn", "app.admin.main:create_admin_app", "--factory", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers", "--no-server-header"]
    environment:
      <<: *api-env
      ADMIN_DATABASE_URL: postgresql+asyncpg://pos_admin:${ADMIN_DB_PASSWORD}@db:5432/${POSTGRES_DB:-pos}
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 300m

  # Background jobs. Until the Postgres job queue arrives, a daily loop runs the subscription job.
  worker:
    <<: *app
    command: ["sh", "-c", "while true; do python -m app.admin.cli subscription-job; sleep 86400; done"]
    environment:
      <<: *api-env
      ADMIN_DATABASE_URL: postgresql+asyncpg://pos_admin:${ADMIN_DB_PASSWORD}@db:5432/${POSTGRES_DB:-pos}
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 200m

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/man-juu/restaurant-pos}/web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
      # Fails closed: without your IPs the admin console does not start.
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:?set ADMIN_ALLOWED_IPS to your IP ranges}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes: [caddy-data:/data, caddy-config:/config]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks:
      internal:
        ipv4_address: 172.28.0.10  # the only address the API trusts for proxy headers
    depends_on: [api, admin]
    mem_limit: 100m

  backup:
    image: ${IMAGE_REGISTRY:-ghcr.io/man-juu/restaurant-pos}/backup:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-pos_owner}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-pos}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-prod}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-19}
    volumes:
      # The owner's PUBLIC backup key only; the private key never lives on the server.
      - /etc/restaurant-pos/backup-public-key.asc:/keys/public-key.asc:ro
      - backup-local:/var/backups/pos
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 200m

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  db-data: {}
  caddy-data: {}
  caddy-config: {}
  backup-local: {}
