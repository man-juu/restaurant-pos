# Local development stack. Defaults work from a clean clone; override any value in a root .env file.
name: restaurant-pos

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      POSTGRES_USER: ${POSTGRES_USER:-pos_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
    ports: ["127.0.0.1:5432:5432"] # bound to localhost only
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pos_owner}:${POSTGRES_PASSWORD:-dev-only-password}@db:5432/${POSTGRES_DB:-pos}
    ports: ["127.0.0.1:8000:8000"]
    volumes: [../backend/app:/app/app]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ../frontend
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    volumes: [../frontend/src:/app/src]
    depends_on: [api]

volumes:
  db-data:
