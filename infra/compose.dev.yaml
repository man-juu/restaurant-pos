# Local development stack. Defaults work from a clean clone; override any value in a root .env file.
name: restaurant-pos

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      POSTGRES_USER: ${POSTGRES_USER:-pos_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dev-only-app-password}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:-dev-only-readonly-password}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-dev-only-admin-password}
    ports: ["127.0.0.1:5432:5432"] # bound to localhost only
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # One-shot: applies migrations as the owner role, then exits. The API waits for it.
  migrate:
    build: { context: ../backend, dockerfile: Dockerfile.dev }
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pos_owner}:${POSTGRES_PASSWORD:-dev-only-password}@db:5432/${POSTGRES_DB:-pos}
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ../backend, dockerfile: Dockerfile.dev }
    environment:
      # The API connects as the restricted role so row-level security always applies.
      DATABASE_URL: postgresql+asyncpg://pos_app:${APP_DB_PASSWORD:-dev-only-app-password}@db:5432/${POSTGRES_DB:-pos}
    ports: ["127.0.0.1:8000:8000"]
    volumes: [../backend/app:/app/app, uploads:/var/lib/pos/uploads]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Platform admin API: separate app, port and database role (pos_admin).
  admin:
    build: { context: ../backend, dockerfile: Dockerfile.dev }
    command: ["uvicorn", "app.admin.main:create_admin_app", "--factory", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    environment:
      ADMIN_DATABASE_URL: postgresql+asyncpg://pos_admin:${ADMIN_DB_PASSWORD:-dev-only-admin-password}@db:5432/${POSTGRES_DB:-pos}
    ports: ["127.0.0.1:8001:8001"]
    volumes: [../backend/app:/app/app]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ../frontend
    environment:
      API_URL: http://api:8000
      ADMIN_API_URL: http://admin:8001
    ports: ["127.0.0.1:5173:5173"]
    volumes: [../frontend/src:/app/src]
    depends_on: [api, admin]

volumes:
  db-data:
  uploads:
