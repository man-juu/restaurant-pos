# Deploy an already-tested release to production. Running this workflow by hand (Actions tab,
# "Run workflow", enter the tag that passed staging) is the manual approval (docs/07 section 7).
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that passed staging, e.g. v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - name: Deploy to production (auto-rollback on failed health check)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy deploy-prod@"$HOST" "$TAG"
