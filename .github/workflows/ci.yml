name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Real PostgreSQL for integration tests (used from slice 0.3).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pos
          POSTGRES_USER: pos_owner
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pos_owner" --health-interval 5s --health-retries 10
    env:
      OWNER_DATABASE_URL: postgresql+asyncpg://pos_owner:ci-only-password@localhost:5432/pos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      # Known vulnerabilities, yanked or removed releases (docs/security-practices.md).
      - run: pip freeze --exclude-editable > /tmp/req.txt && python scripts/check_dependencies.py /tmp/req.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: lint-imports
      - run: complexipy app scripts --max-complexity-allowed 15 --quiet  # cognitive complexity
      - run: pytest
      # The frontend's API types are generated from these schemas; fail if they are stale.
      - run: python -m app.openapi ../frontend/src/lib/api && git diff --exit-code -- ../frontend/src/lib/api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run audit:deps
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run api:generate && git diff --exit-code -- src/lib/api
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Sign-in, language switch, module-hidden navigation at phone, tablet and desktop sizes.
      - run: npm run e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Scans the full history for committed secrets (docs/06).
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  # Production images must keep building (non-root API, Caddy web image, backup job image).
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t pos-api:ci backend
      - run: docker build -t pos-web:ci -f infra/web/Dockerfile .
      - run: docker build -t pos-backup:ci infra/backup
      - name: API image runs as non-root
        run: test "$(docker run --rm --entrypoint id pos-api:ci -u)" != "0"
      - name: Caddyfile is valid
        run: docker run --rm -e APP_DOMAIN=example.test -e ADMIN_DOMAIN=admin.example.test -e ADMIN_ALLOWED_IPS=127.0.0.1/32 pos-web:ci caddy validate --config /etc/caddy/Caddyfile
      - name: Shell scripts are valid
        run: for f in infra/backup/*.sh infra/scripts/*.sh; do sh -n "$f"; done
