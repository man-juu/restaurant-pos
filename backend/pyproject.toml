[project]
name = "restaurant-pos-backend"
version = "0.1.0"
requires-python = ">=3.12"
# Exact pins: this is an application, so builds must be reproducible.
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "sqlalchemy[asyncio]==2.1.3",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "httpx==0.28.1",
    "hypothesis==6.168.5",
    "import-linter==2.15",
    "pre-commit==4.6.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Layer contracts (CLAUDE.md rule 4). Per-module rules come from each module.py manifest and
# are checked by tests/test_module_boundaries.py, so they cannot drift from the manifests.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layers: main > admin > modules > core"
type = "layers"
layers = ["app.main", "app.admin", "app.modules", "app.core"]
